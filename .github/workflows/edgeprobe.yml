name: Edge probe
on: { workflow_dispatch: }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL -o xiv-dl https://github.com/WorkingRobot/ffxiv-downloader/releases/latest/download/xiv-dl-linux-x64
          chmod +x xiv-dl
          mkdir -p scratch/repos
          cp repos/4e9a232b.json repos/6cfeab11.json scratch/repos/
          cd scratch
          for n in 1 2 3 4 5; do
            echo "--- run $n ---"
            ../xiv-dl --verbose index liveness -p . --parallelism 8 2>&1 | grep -E 'changed'
            git --no-pager diff --no-index /dev/null /dev/null >/dev/null 2>&1 || true
            python3 -c "
import json
for s in ('4e9a232b','6cfeab11'):
    d=json.load(open(f'repos/{s}.json'))
    for v,p in d['patches'].items():
        for src in p['sources'].values():
            if '2026.08.31.0000.0000' in src['url'] or '2026.08.28.0000.0001' in src['url']:
                print(' ', s, v, src['status'])
"
          done
