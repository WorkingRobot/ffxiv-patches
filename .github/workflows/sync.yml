name: Sync
on:
  # Offset from poll.yml's */15 so the two do not contend for the write group.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: robinraju/release-downloader@v1
        with:
          repository: WorkingRobot/ffxiv-downloader
          latest: true
          fileName: xiv-dl-linux-x64
      - run: chmod +x xiv-dl-linux-x64 && mv xiv-dl-linux-x64 xiv-dl

      # The version report is the boot repository's own files, so it comes from the boot repository.
      - id: boot
        run: echo "version=$(python3 -c "import json;print(json.load(open('repos/2b5cbc63.json'))['latest'])")" >> "$GITHUB_OUTPUT"
      - id: bootcache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/boot
          key: boot-${{ steps.boot.outputs.version }}
      - if: steps.bootcache.outputs.cache-hit != 'true'
        run: ./xiv-dl download -s 2b5cbc63 -o '${{ runner.temp }}/boot' -f 'ffxiv(boot|launcher|updater)(64)?\.exe$'

      # A session survives for hours, so most runs are one 204 and no login at all.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sid
          key: sid-
          restore-keys: sid-
      - id: sync
        env:
          SQEX_USER: ${{ secrets.SQEX_USER }}
          SQEX_PASS: ${{ secrets.SQEX_PASS }}
        run: python3 .github/sync.py --path . --boot-dir '${{ runner.temp }}/boot' --boot-version '${{ steps.boot.outputs.version }}' --sid-file '${{ runner.temp }}/sid'
      - if: steps.sync.outputs.relogin == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sid
          key: sid-${{ github.run_id }}

      - run: ./xiv-dl index check -p .

      # The exe comes through ffxiv-lut's CLUT, which lands a while after a patch; until then
      # the download fails and stasis.json stays as it was.
      - id: game
        run: echo "version=$(python3 -c "import json;print(json.load(open('repos/4e9a232b.json'))['latest'])")" >> "$GITHUB_OUTPUT"
      - id: gamecache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/game
          key: game-${{ steps.game.outputs.version }}
      - id: exe
        if: steps.gamecache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./xiv-dl download -s 4e9a232b -v '${{ steps.game.outputs.version }}' -o '${{ runner.temp }}/game' -f 'ffxiv_dx11\.exe$'
      - if: steps.exe.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/game
          key: game-${{ steps.game.outputs.version }}
      - if: steps.gamecache.outputs.cache-hit == 'true' || steps.exe.outcome == 'success'
        continue-on-error: true
        run: python3 .github/stasis.py --path . --boot-dir '${{ runner.temp }}/boot' --exe '${{ runner.temp }}/game/ffxiv_dx11.exe'

      - run: rm -f xiv-dl && ./.github/push.sh "sync global"
        shell: bash
